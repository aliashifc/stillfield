[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # matches "engines" in package.json
  NODE_VERSION = "22"

# Astro fingerprints everything under /_astro, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts never change without a filename change either.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify serves this as application/octet-stream, which some browsers refuse
# to parse as a manifest.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Netlify serves dist/404.html for unmatched paths automatically, and handles
# HTTPS plus the www/apex redirect once the domain is attached in its UI —
# neither needs configuring here.
